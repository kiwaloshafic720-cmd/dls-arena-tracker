  <div id="appview"><noscript><section class="hero"><div><div class="kicker">Arena League Hub</div><h1>Online Game League &amp; Tournament Tracker</h1><p>Create a league for your game, share the fixtures with players, and keep scores and standings together in one place.</p></div></section><section class="panel"><div class="ph"><div><h2>Bring your game league together</h2><p>Arena League Hub helps organisers create separate leagues and share a direct player link. Players can view fixtures, results, and the league table.</p></div></div></section></noscript></div>

<script>
(()=>{'use strict';
const C=window.DLS_CLOUD||{},ready=!!(C.url&&C.publishableKey&&window.supabase);const db=ready?window.supabase.createClient(C.url,C.publishableKey):null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const host=$('#appview');let user=null,league=null,isOwner=false,myPlayerId=null,branding={},memberships={},tab='matches',timer,authMode='signin';const BADGES={shield:'🛡️',crown:'👑',flame:'🔥',lightning:'⚡',star:'⭐',eagle:'🦅',lion:'🦁',ball:'⚽'};$('#year').textContent=new Date().getFullYear();

async function saveBranding(playerId,badge,file,clearCustom=false){let logoPath=clearCustom?null:(branding[playerId]?.logo_path||null);if(file){if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024)return toast('Choose a PNG, JPG, or WebP image under 2 MB');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=`${league.id}/${playerId}/${crypto.randomUUID()}.${ext}`,{error:uploadError}=await db.storage.from('dls-team-logos').upload(path,file,{contentType:file.type,upsert:false});if(uploadError)return toast('Logo upload failed: '+uploadError.message);logoPath=path}const{error}=await db.from('team_branding').upsert({league_id:league.id,player_id:playerId,builtin_badge:badge||null,logo_path:logoPath,updated_at:new Date().toISOString()},{onConflict:'league_id,player_id'});if(error)return toast('Logo could not be saved: '+error.message);branding[playerId]={builtin_badge:badge||null,logo_path:logoPath};renderLeague();toast('Team logo updated')}
function showAuth(mode='signin'){authMode=mode;$('#authTitle').textContent=mode==='signup'?'Create your account':mode==='reset'?'Reset your password':'Welcome back';$('#authHelp').textContent=mode==='signup'?'Create an account with your email. You may need to verify it before signing in.':mode==='reset'?'Choose a new password for your account.':'Sign in to create and manage your leagues.';$('#passwordLabel').classList.toggle('hidden',mode==='forgot');$('#authPassword').required=mode!=='forgot';$('#authPassword').value='';$('#authEmail').value='';$('#authEmail').required=mode!=='reset';$('#authEmail').parentElement.classList.toggle('hidden',mode==='reset');$('#authMessage').textContent='';$('#forgotBtn').classList.toggle('hidden',mode!=='signin');$('#authSwitch').classList.toggle('hidden',!['signin','signup'].includes(mode));$('#authSwitch').textContent=mode==='signup'?'Already have an account? Sign in':'Create account';$('#authSubmit').textContent=mode==='signup'?'Create account':mode==='forgot'?'Send reset email':mode==='reset'?'Save new password':'Sign in';$('#authModal').classList.add('show')}

function home(){league=null;isOwner=false;myPlayerId=null;const params=new URLSearchParams(location.search),codeVal=directCode();$('#accountBtn').textContent=user?'My leagues':'Sign in';if(codeVal){loadLeague(codeVal,params.get('manage')==='1');return}if(user){dashboard();return}host.innerHTML=`<section class="hero"><div><div class="kicker">One hub · your leagues</div><h1>Bring your league together.</h1><p>Create a league for your game, share its direct link, and keep everyone up to date.</p></div><button class="btn primary" id="startBtn">Create a league</button></section><section class="panel"><div class="ph"><div><h2>Welcome to Arena League Hub</h2><p>Players enter through a link shared by their organiser. Each league has its own space and results.</p></div></div><div class="empty">Have a league link? Open it to see that league. To join a team with a league code, sign in or create an account first.<br><br><button class="btn primary" id="homeSign">Sign in or create account</button></div></section>`;$('#startBtn').onclick=()=>showAuth('signup');$('#homeSign').onclick=()=>showAuth('signin')}
async function dashboard(){league=null;isOwner=false;myPlayerId=null;$('#accountBtn').textContent='My leagues';host.innerHTML=`<section class="hero"><div><div class="kicker">Your account</div><h1>Your leagues.</h1><p>Manage leagues or join a team with its unique code.</p></div><div class="actions"><button id="newLeague" class="btn primary">＋ Create a league</button><button id="logout" class="btn">Sign out</button></div></section><section class="panel"><div class="ph"><div><h2>Join a league</h2><p>Enter the code shared by the league admin, then claim your player name.</p></div></div><div class="joinbox"><label>League code<input id="joinCode" maxlength="12" autocomplete="off" placeholder="Example: 8F21A4BC09D4"></label><button id="findLeague" class="btn primary">Find league</button><div class="joinresult" id="joinResult"></div></div></section><section class="panel"><div class="ph"><div><h2>Teams you own</h2><p>Open your team page to update its logo.</p></div></div><div id="playerLeagueList" class="league-list"><div class="empty">Loading your teams…</div></div></section><section class="panel"><div class="ph"><div><h2>Leagues you administer</h2><p>Only admins can edit match results and standings.</p></div></div><div id="leagueList" class="league-list"><div class="empty">Loading your leagues…</div></div></section>`;$('#newLeague').onclick=()=>$('#createModal').classList.add('show');$('#logout').onclick=async()=>{await db.auth.signOut();user=null;home()};$('#findLeague').onclick=async()=>{const joinCode=$('#joinCode').value.trim().toUpperCase();if(!joinCode)return toast('Enter a league code');const{data,error}=await db.rpc('get_league_join_details',{p_join_code:joinCode});if(error)return toast('Could not find that league: '+error.message);const d=Array.isArray(data)?data[0]:data;if(!d)return toast('That league code is not valid');const choices=(d.players||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');if(!choices){$('#joinResult').innerHTML='<div class="notice">All available team names are already claimed.</div>';return}$('#joinResult').innerHTML=`<div class="notice"><b>${esc(d.name)}</b> · ${esc(d.game)}<form id="joinLeagueForm"><label>Your team<select id="joinPlayer" class="input" required><option value="">Choose your player name</option>${choices}</select></label><button class="btn primary" type="submit">Join league</button></form></div>`;$('#joinLeagueForm').onsubmit=async e=>{e.preventDefault();const{data:joined,error:joinError}=await db.rpc('join_league',{p_join_code:joinCode,p_player_id:$('#joinPlayer').value});if(joinError)return toast('Could not join: '+joinError.message);const result=Array.isArray(joined)?joined[0]:joined;toast('You joined '+(result?.league_name||d.name));history.pushState({},'',`?league=${encodeURIComponent(result.share_code)}`);loadLeague(result.share_code,false)}};try{let query=db.from('leagues').select('id,name,game,share_code,join_code,updated_at').order('created_at',{ascending:false});if(user.id!==C.adminUserId)query=query.eq('owner_id',user.id);const{data,error}=await query;if(error)throw error;$('#leagueList').innerHTML=data.length?data.map(l=>`<article class="league-card"><h3>${esc(l.name)}</h3><p>${esc(l.game)}</p><div class="actions"><button class="btn primary" data-open="${l.id}">Open</button><button class="btn" data-copy="${l.id}">Copy player link</button><button class="btn" data-copy-code="${l.id}">Copy join code</button><button class="btn danger" data-delete="${l.id}">Delete</button></div><div class="join-code">Join code: <span class="league-code">${esc(l.join_code||'Setup required')}</span></div></article>`).join(''):'<div class="empty">No leagues to administer yet. Create your first one above.</div>';data.forEach(l=>{host.querySelector(`[data-open="${l.id}"]`).onclick=()=>{history.pushState({},'',`?league=${encodeURIComponent(l.share_code)}&manage=1`);loadLeague(l.share_code,true)};host.querySelector(`[data-copy="${l.id}"]`).onclick=async()=>{try{await navigator.clipboard.writeText(leagueUrl(l));toast('Player link copied')}catch{prompt('Copy this player link:',leagueUrl(l))}};host.querySelector(`[data-copy-code="${l.id}"]`).onclick=async()=>{try{await navigator.clipboard.writeText(l.join_code);toast('League code copied')}catch{prompt('Copy this league code:',l.join_code)}};host.querySelector(`[data-delete="${l.id}"]`).onclick=async()=>{if(!confirm(`Delete “${l.name}” and its results? This cannot be undone.`))return;const{error}=await db.from('leagues').delete().eq('id',l.id);if(error)return toast('Could not delete: '+error.message);toast('League deleted');dashboard()}})}catch(e){$('#leagueList').innerHTML=`<div class="empty">Could not load administered leagues. Apply the database setup before using the hub.<br>${esc(e.message)}</div>`}try{const{data,error}=await db.rpc('get_my_player_leagues');if(error)throw error;$('#playerLeagueList').innerHTML=data?.length?data.map(l=>`<article class="league-card"><h3>${esc(l.name)}</h3><p>${esc(l.game)} · Team: ${esc(l.player_name)}</p>${l.approved?`<button class="btn primary" data-player-open="${l.id}">Open my team</button>`:'<span class="dim">Awaiting league admin approval</span>'}</article>`).join(''):'<div class="empty">You have not joined a team yet.</div>';data?.forEach(l=>host.querySelector(`[data-player-open="${l.id}"]`).onclick=()=>{history.pushState({},'',`?league=${encodeURIComponent(l.share_code)}`);loadLeague(l.share_code,false)})}catch(e){$('#playerLeagueList').innerHTML=`<div class="empty">Could not load joined teams. ${esc(e.message)}</div>`}}async function loadLeague(share,manageView=false){host.innerHTML='<div class="empty">Opening league…</div>';try{let row=null;if(user){let q=db.from('leagues').select('*').eq('share_code',share);if(user.id!==C.adminUserId)q=q.eq('owner_id',user.id);const{data,error}=await q.maybeSingle();if(error)throw error;if(data)row=data}if(!row){const{data,error}=await db.rpc('get_league_by_share_code',{p_share_code:share});if(error)throw error;row=Array.isArray(data)?data[0]:data}if(!row){host.innerHTML='<section class="panel"><div class="empty">This league link is invalid or the league has been removed.<br><button id="backHome" class="btn">Go to Arena League Hub</button></div></section>';$('#backHome').onclick=()=>{history.pushState({},'',location.pathname);home()};return}league=row;isOwner=!!(manageView&&user&&(row.owner_id===user.id||user.id===C.adminUserId));myPlayerId=null;branding={};memberships={};if(user){try{const{data}=await db.from('league_memberships').select('player_id,user_id,approved').eq('league_id',row.id);for(const m of data||[])memberships[m.player_id]=m;myPlayerId=(data||[]).find(m=>m.user_id===user.id&&m.approved)?.player_id||null}catch{} }try{const{data}=await db.from('team_branding').select('player_id,builtin_badge,logo_path').eq('league_id',row.id);for(const b of data||[])branding[b.player_id]=b}catch{}league.state=league.state||defaultState();if(!Array.isArray(league.state.players))league.state.players=[];if(!Array.isArray(league.state.matches))league.state.matches=[];tab='matches';renderLeague()}catch(e){host.innerHTML=`<section class="panel"><div class="empty">Unable to open this league. ${esc(e.message)}</div></section>`}}function fixtureRounds(){const teams=[...league.state.players];if(teams.length<2)return[];if(teams.length%2)teams.push(null);const rotation=[...teams],rounds=teams.length-1,perRound=teams.length/2,result=[];for(let day=0;day<rounds;day++){const matches=[];for(let i=0;i<perRound;i++){const first=rotation[i],second=rotation[teams.length-1-i];if(!first||!second)continue;const home=(day%2===0?first:second),away=(day%2===0?second:first);matches.push({id:[home.id,away.id].sort().join('_'),home:home.id,away:away.id})}result.push(matches);rotation.splice(1,0,rotation.pop())}return result}
function standings(){const s=league.state,p=s.players.map(x=>({id:x.id,name:x.name,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0})),by=Object.fromEntries(p.map(x=>[x.id,x]));s.matches.forEach(m=>{const h=by[m.home],a=by[m.away];if(!h||!a)return;h.P++;a.P++;h.GF+=m.hs;h.GA+=m.as;a.GF+=m.as;a.GA+=m.hs;if(m.hs>m.as){h.W++;h.Pts+=3;a.L++}else if(m.as>m.hs){a.W++;a.Pts+=3;h.L++}else{h.D++;a.D++;h.Pts++;a.Pts++}});p.forEach(x=>x.GD=x.GF-x.GA);return p.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.name.localeCompare(b.name))}
function pname(id){return league.state.players.find(p=>p.id===id)?.name||'Removed'}
async function save(){if(!isOwner||!user)return false;const {error}=await db.from('leagues').update({state:league.state,updated_at:new Date().toISOString()}).eq('id',league.id);if(error){toast('Save failed: '+error.message);await loadLeague(league.share_code);return false}renderLeague();toast('League updated');return true}
function renderLeague(){const s=league.state,r=standings(),played=s.matches.length,total=s.players.length*(s.players.length-1)/2,remaining=Math.max(0,total-played),champ=r[0]||{name:'No champion yet',Pts:0};$('#accountBtn').textContent=user?'My leagues':'Sign in';const complete=s.players.length>=2&&remaining===0;host.innerHTML=`<section class="hero"><div><div class="kicker">${esc(league.game)}${isOwner?' · organiser':''}</div><h1>${esc(league.name)}</h1><p>${isOwner?'Share this league with players. Only your account can edit it.':'Public view · results and standings for this league.'}</p></div><div class="actions">${isOwner?'<button id="copyLink" class="btn primary">Copy player link</button><button id="copyJoinCode" class="btn">Copy join code</button><button id="backDash" class="btn">My leagues</button>':'<button id="homeLink" class="btn">Arena League Hub</button>'}<button id="export" class="btn">↓ Export</button></div></section>${isOwner?`<div class="notice">Player link: <span class="link">${esc(leagueUrl())}</span><br>League code: <span class="league-code">${esc(league.join_code||'—')}</span></div>`:''}<div class="cards"><div class="card"><small>Matches played</small><strong>${played} / ${total}</strong></div><div class="card"><small>Fixtures left</small><strong>${remaining}</strong></div><div class="card"><small>Goals scored</small><strong>${r.reduce((a,x)=>a+x.GF,0)}</strong></div><div class="card"><small>Win / draw</small><strong>3 / 1 pts</strong></div></div><div class="grid"><section class="panel"><div class="ph"><div><h2>League table</h2><p>Points, goal difference, then goals scored</p></div></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${r.map((x,i)=>`<tr class="${i===0&&x.P?'winner':''}"><td>${String(i+1).padStart(2,'0')}</td><td class="name">${logoHTML(x.id)}${esc(x.name)}</td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}</td><td>${x.GA}</td><td>${x.GD>0?'+':''}${x.GD}</td><td class="pts">${x.Pts}</td></tr>`).join('')}</tbody></table></div></section><aside><section class="panel"><div class="ph"><div><h2>${complete?'Tournament champion':'Race to the crown'}</h2><p>${complete?`${esc(champ.name)} wins the league with ${champ.Pts} points.`:`${remaining} matches remaining`}</p></div></div>${[...s.matches].reverse().slice(0,5).map(m=>`<div class="match"><span class="dim">FT</span><span>${esc(pname(m.home))} <span class="dim">vs</span> ${esc(pname(m.away))}</span><b class="score">${m.hs} – ${m.as}</b></div>`).join('')||'<div class="empty">No matches played yet</div>'}</section><section class="panel"><div class="ph"><div><h2>Player stats</h2><p>Season leaders</p></div></div><div class="match"><span class="dim">TOP GOALS</span><b>${esc([...r].sort((a,b)=>b.GF-a.GF)[0]?.name||'—')}</b><b class="pts">${[...r].sort((a,b)=>b.GF-a.GF)[0]?.GF||0}</b></div><div class="match"><span class="dim">MOST WINS</span><b>${esc([...r].sort((a,b)=>b.W-a.W)[0]?.name||'—')}</b><b class="pts">${[...r].sort((a,b)=>b.W-a.W)[0]?.W||0}</b></div></section></aside></div><nav class="tabs"><button class="tab ${tab==='matches'?'active':''}" data-tab="matches">Matches</button><button class="tab ${tab==='players'?'active':''}" data-tab="players">Players</button></nav><main id="content"></main>`;
$('#copyLink')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(leagueUrl());toast('Player link copied')}catch{prompt('Copy this player link:',leagueUrl())}});$('#copyJoinCode')?.addEventListener('click',async()=>{if(!league.join_code)return toast('Apply the player accounts migration first');try{await navigator.clipboard.writeText(league.join_code);toast('League code copied')}catch{prompt('Copy this league code:',league.join_code)}});$('#backDash')?.addEventListener('click',()=>{history.pushState({},'',location.pathname);dashboard()});$('#homeLink')?.addEventListener('click',()=>{history.pushState({},'',location.pathname);home()});$('#export').onclick=exportCsv;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderLeague()});renderContent()}
function renderContent(){const target=$('#content');if(tab==='matches'){const rounds=fixtureRounds(),fs=rounds.flat();target.innerHTML=`<section class="panel"><div class="ph"><div><h2>Match centre</h2><p>${isOwner?'Record or update scores.':'Fixtures and results are public.'}</p></div><select id="filter" class="input" style="width:auto"><option value="all">All fixtures</option><option value="played">Played</option><option value="upcoming">Upcoming</option></select></div><div id="rows"></div></section>`;const fill=()=>{const f=$('#filter')?.value||'all';const grouped=rounds.map((round,day)=>{const list=round.filter(x=>f==='all'||(f==='played')===league.state.matches.some(m=>m.id===x.id));if(!list.length)return'';const played=round.filter(x=>league.state.matches.some(m=>m.id===x.id)).length;return`<section class="matchday"><div class="matchday-head"><h3>Matchday ${day+1}</h3><span>${played} / ${round.length} played</span></div>${list.map((x,i)=>{const m=league.state.matches.find(y=>y.id===x.id);return`<div class="row"><span class="dim">${String(i+1).padStart(2,'0')}</span><span class="left">${esc(pname(x.home))}</span><input type="number" min="0" max="99" value="${m?m.hs:''}" placeholder="–" data-h="${x.id}" ${isOwner?'':'disabled'}><span class="dim">:</span><input type="number" min="0" max="99" value="${m?m.as:''}" placeholder="–" data-a="${x.id}" ${isOwner?'':'disabled'}><span class="right">${esc(pname(x.away))}</span>${isOwner?`<button class="btn primary" data-save="${x.id}">${m?'Update':'Save'}</button>`:'<span></span>'}</div>`}).join('')}</section>`}).join('');$('#rows').innerHTML=grouped||'<div class="empty">'+(fs.length?'No fixtures match this filter.':'Add players to create fixtures.')+'</div>';target.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,h=target.querySelector(`[data-h="${id}"]`),a=target.querySelector(`[data-a="${id}"]`);if(h.value===''||a.value==='')return toast('Enter both scores');const hs=Number(h.value),as=Number(a.value);if(!Number.isInteger(hs)||!Number.isInteger(as)||hs<0||as<0||hs>99||as>99)return toast('Scores must be whole numbers from 0 to 99');const x=fs.find(z=>z.id===id),old=league.state.matches.findIndex(z=>z.id===id),m={...x,hs,as};if(old<0)league.state.matches.push(m);else league.state.matches[old]=m;await save()})};$('#filter').onchange=fill;fill()}else{target.innerHTML=`<div class="grid"><section class="panel"><div class="ph"><div><h2>Player statistics</h2><p>Current league record</p></div></div><div class="tablewrap"><table><thead><tr><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${standings().map(x=>`<tr><td class="name">${logoHTML(x.id)}${esc(x.name)}</td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}</td><td>${x.GA}</td><td>${x.GD}</td><td class="pts">${x.Pts}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="ph"><div><h2>Teams &amp; logos</h2><p>${isOwner?'Add a badge or upload a logo for any team. Players may update their logo after your approval. 15 players maximum':'Tournament roster'}</p></div></div><div class="roster">${isOwner?'<div class="actions"><input class="input" id="newname" maxlength="20" placeholder="Player name"><button class="btn primary" id="add">Add</button></div>':''}${league.state.players.map(p=>`<div class="rosterline"><span class="brandrow">${logoHTML(p.id)}<b>${esc(p.name)}</b>${isOwner&&memberships[p.id]?`<button class="btn" data-remove-owner="${esc(memberships[p.id].user_id)}">${memberships[p.id].approved?'Remove owner':'Reject claim'}</button>`:''}${isOwner&&memberships[p.id]&&!memberships[p.id].approved?`<button class="btn primary" data-approve="${esc(memberships[p.id].user_id)}">Approve owner</button>`:''}${isOwner||myPlayerId===p.id?`<select class="input" data-badge="${esc(p.id)}" aria-label="Choose ${esc(p.name)} badge"><option value="">Choose badge</option>${Object.entries(BADGES).map(([k,v])=>`<option value="${k}" ${branding[p.id]?.builtin_badge===k?'selected':''}>${v}</option>`).join('')}</select><input type="file" class="input" data-logo="${esc(p.id)}" accept="image/png,image/jpeg,image/webp" aria-label="Upload ${esc(p.name)} logo">`:''}${isOwner?`<button class="btn" data-remove="${esc(p.id)}">Remove</button>`:''}</span></div>`).join('')||'<div class="empty">No players have joined this roster yet.</div>'}${isOwner?'<p><button id="reset" class="btn danger">Reset league results</button></p>':''}</div></section></div>`;if(isOwner){$('#add').onclick=async()=>{const name=$('#newname').value.trim();if(!name)return toast('Enter a player name');if(league.state.players.length>=15)return toast('League is limited to 15 players');if(league.state.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('Name already exists');league.state.players.push({id:'p'+Date.now().toString(36),name});await save()};target.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(league.state.players.length<=2||!confirm('Remove this player and their results?'))return;const id=b.dataset.remove;league.state.players=league.state.players.filter(p=>p.id!==id);league.state.matches=league.state.matches.filter(m=>m.home!==id&&m.away!==id);await save()});$('#reset').onclick=async()=>{if(!confirm('Clear all players and results in this league?'))return;league.state=defaultState();await save();tab='matches';renderLeague()}}target.querySelectorAll('[data-remove-owner]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this team claim?'))return;const{error}=await db.from('league_memberships').delete().eq('league_id',league.id).eq('user_id',b.dataset.removeOwner);if(error)return toast('Could not remove claim: '+error.message);toast('Team claim removed');await loadLeague(league.share_code,true)});target.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{const{error}=await db.from('league_memberships').update({approved:true}).eq('league_id',league.id).eq('user_id',b.dataset.approve);if(error)return toast('Approval failed: '+error.message);toast('Player team approved');await loadLeague(league.share_code,true)});target.querySelectorAll('[data-badge]').forEach(e=>e.onchange=()=>saveBranding(e.dataset.badge,e.value,null,true));target.querySelectorAll('[data-logo]').forEach(e=>e.onchange=()=>{const f=e.files?.[0];if(f)saveBranding(e.dataset.logo,null,f,true)})}}
function exportCsv(){const rows=standings(),csv=[['Pos','Player','P','W','D','L','GF','GA','GD','Pts'],...rows.map((x,i)=>[i+1,x.name,x.P,x.W,x.D,x.L,x.GF,x.GA,x.GD,x.Pts])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=(league.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'league')+'-standings.csv';a.click();URL.revokeObjectURL(a.href)}
$('#accountBtn').onclick=()=>{if(user){history.pushState({},'',location.pathname);dashboard()}else showAuth('signin')};$('#authSwitch').onclick=()=>showAuth(authMode==='signup'?'signin':'signup');$('#authCancel').onclick=()=>$('#authModal').classList.remove('show');$('#createCancel').onclick=()=>$('#createModal').classList.remove('show');$('#authForm').onsubmit=async e=>{e.preventDefault();if(!db)return;const email=$('#authEmail').value.trim(),password=$('#authPassword').value;$('#authMessage').textContent='Working…';let result;if(authMode==='signup')result=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});else if(authMode==='forgot')result=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});else if(authMode==='reset')result=await db.auth.updateUser({password});else result=await db.auth.signInWithPassword({email,password});if(result.error){$('#authMessage').textContent=result.error.message;return}if(authMode==='signup'){$('#authMessage').textContent='Account created. Check your email for the verification link, then sign in.';return}if(authMode==='forgot'){$('#authMessage').textContent='If an account exists for that email, a password reset link has been sent.';return}$('#authModal').classList.remove('show');toast(authMode==='reset'?'Password updated':'Signed in');};$('#forgotBtn').onclick=()=>showAuth('forgot');$('#createForm').onsubmit=async e=>{e.preventDefault();if(!user)return showAuth('signup');const name=$('#leagueName').value.trim(),game=$('#leagueGame').value;const {data,error}=await db.from('leagues').insert({owner_id:user.id,name,game,share_code:code(),state:defaultState()}).select('id,name,game,share_code,state,owner_id,join_code').single();if(error)return toast('Could not create league: '+error.message);$('#createModal').classList.remove('show');toast('League created');history.pushState({},'',`?league=${encodeURIComponent(data.share_code)}&manage=1`);league=data;league.updated_at=new Date().toISOString();isOwner=true;renderLeague()};
window.addEventListener('popstate',()=>home());
if(!ready){$('#status').textContent='Setup needed';host.innerHTML='<section class="panel"><div class="empty">Connect this site to its existing Supabase project to activate accounts and leagues.</div></section>'}else{db.auth.getSession().then(async({data})=>{user=data.session?.user||null;$('#status').textContent='Online';if(location.hash.includes('type=recovery'))showAuth('reset');else home()});db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;$('#status').textContent='Online';if(league){loadLeague(league.share_code,new URLSearchParams(location.search).get('manage')==='1')}else home()})}
})();
