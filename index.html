    :root{--bg:#0d1512;--panel:#15211c;--line:#293a31;--text:#f0f3eb;--muted:#9aaa9f;--lime:#c5f36a;--red:#ff8585}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#26452c,transparent 38%),var(--bg);color:var(--text);font:14px 'DM Sans',sans-serif}.app{max-width:1180px;margin:auto;padding:0 22px 45px}.top{min-height:76px;border-bottom:1px solid #ffffff16;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:1px}.brand b{color:var(--lime)}.status{font-size:11px;color:var(--muted)}.status:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--lime);margin-right:8px}.btn{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 14px;color:var(--text);font-weight:700;background:transparent;font:600 13px 'DM Sans',sans-serif}.primary{background:var(--lime);border-color:var(--lime);color:#172218}.danger{color:var(--red)}.hero{padding:32px 0 22px;display:flex;justify-content:space-between;align-items:end;gap:14px}.kicker{font-size:10px;letter-spacing:2px;color:var(--lime);font-weight:700;text-transform:uppercase}.hero h1{font:800 48px/.95 'Barlow Condensed';text-transform:uppercase;margin:9px 0}.hero p{color:var(--muted);margin:0;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card,.panel{background:#15211ceF;border:1px solid var(--line);border-radius:14px}.card{padding:15px}.card small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:10px}.card strong{display:block;font:700 30px 'Barlow Condensed';margin-top:4px;color:var(--lime)}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:15px}.panel{overflow:hidden;margin-bottom:15px}.ph{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.ph h2{font:700 22px 'Barlow Condensed';text-transform:uppercase;margin:0}.ph p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.5}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 9px;text-align:center;border-bottom:1px solid #ffffff0b;font-size:12px}th{color:#87968d;text-transform:uppercase;letter-spacing:1px;font-size:9px}th:nth-child(2),td:nth-child(2){text-align:left}.name{font-weight:700}.pts{color:var(--lime);font-weight:800}.winner{background:#c5f36a0d}.match{display:grid;grid-template-columns:48px 1fr auto;align-items:center;padding:12px 17px;border-bottom:1px solid #ffffff0b;gap:9px;font-size:11px}.match:last-child{border:0}.score{font:700 19px 'Barlow Condensed'}.dim{color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row{display:grid;grid-template-columns:42px minmax(55px,1fr) 58px 14px 58px minmax(55px,1fr) 72px;gap:7px;align-items:center;padding:10px 13px;border-bottom:1px solid #ffffff0b;font-size:11px}.row .left{text-align:right;font-weight:600}.row .right{font-weight:600}.row input,.input{background:#0e1712;border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px;width:100%;min-width:0;font:inherit}.row input{text-align:center}.row button{padding:8px 4px;font-size:10px}.row input:disabled,.row button:disabled{opacity:.55}.tabs{display:flex;gap:6px;margin:8px 0 13px}.tab{cursor:pointer;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:9px 13px;font-weight:700;font-size:11px}.tab.active{color:var(--lime);border-color:#c5f36a66;background:#c5f36a15}.roster{padding:13px 17px}.rosterline{padding:9px 0;border-bottom:1px solid #ffffff0b;display:flex;justify-content:space-between;align-items:center}.empty{padding:24px;text-align:center;color:var(--muted);line-height:1.6}.modalbg{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:18px;z-index:3}.modalbg.show{display:grid}.modal{width:min(440px,100%);max-height:90vh;overflow:auto;padding:22px;border:1px solid #405148;border-radius:14px;background:#17231d}.modal h2{font:700 25px 'Barlow Condensed';margin:0}.modal p{font-size:12px;color:var(--muted);line-height:1.55}.modal label{font-size:11px;color:var(--muted);display:block;margin-top:10px}.modal input,.modal select{width:100%;margin:6px 0 0;padding:11px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--lime);color:#172218;padding:11px 15px;border-radius:8px;font-size:12px;font-weight:700;z-index:5;max-width:calc(100% - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}footer{text-align:center;color:#78867d;font-size:11px;padding:24px 8px}footer strong{color:var(--lime)}.notice{padding:13px 15px;color:var(--muted);line-height:1.55;border:1px solid var(--line);border-radius:10px;margin:12px 0}.link{color:var(--lime);word-break:break-all}.league-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}.league-card{padding:16px;border:1px solid var(--line);border-radius:11px;background:#0e1712}.league-card h3{font:700 24px 'Barlow Condensed';margin:0 0 4px}.league-card p{margin:0 0 14px;color:var(--muted);font-size:12px}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:0 12px 28px}.top{min-height:64px}.hero{display:block;padding:25px 0 17px}.hero h1{font-size:42px}.hero .btn{margin-top:15px}.row{grid-template-columns:27px minmax(45px,1fr) 42px 8px 42px minmax(45px,1fr) 52px;gap:3px;padding:9px 5px;font-size:9px}.row input{padding:7px 1px}.row button{font-size:9px;padding:7px 2px}.cards{gap:7px}.card{padding:12px}.ph{padding:14px}.status{font-size:0}.status:before{font-size:11px}.hero p{font-size:12px}.league-list{grid-template-columns:1fr;padding:12px}.fieldgrid{grid-template-columns:1fr}.hero h1{line-height:1}}
  </style>

<body>
<div class="app">
  <header class="top"><a class="brand" href="./" style="color:inherit;text-decoration:none">ARENA <b>LEAGUE HUB</b></a><div class="actions"><span id="status" class="status">Connecting</span><button id="accountBtn" class="btn">Sign in</button></div></header>
  <div id="appview"></div>

</div>
<div class="modalbg" id="authModal"><form class="modal" id="authForm"><h2 id="authTitle">Welcome back</h2><p id="authHelp">Sign in to create and manage your leagues.</p><label>Email<input id="authEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label id="passwordLabel">Password<input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters"></label><div class="modalfoot"><button type="button" class="btn" id="authCancel">Cancel</button><button type="button" class="btn" id="authSwitch">Create account</button><button type="button" class="btn" id="forgotBtn">Forgot password</button><button type="submit" class="btn primary" id="authSubmit">Sign in</button></div><p id="authMessage" aria-live="polite"></p></form></div>
<div class="modalbg" id="createModal"><form class="modal" id="createForm"><h2>Create a league</h2><p>Your league is private to your account. Share its direct link with players.</p><label>League name<input id="leagueName" maxlength="60" required placeholder="Friday Night League"></label><label>Game<select id="leagueGame"><option>Dream League Soccer</option><option>eFootball</option><option>EA SPORTS FC</option><option>Other</option></select></label><div class="modalfoot"><button type="button" class="btn" id="createCancel">Cancel</button><button type="submit" class="btn primary">Create league</button></div></form></div>
<div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="online-config.js"></script>
<script>
(()=>{'use strict';
const C=window.DLS_CLOUD||{},ready=!!(C.url&&C.publishableKey&&window.supabase);const db=ready?window.supabase.createClient(C.url,C.publishableKey):null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const host=$('#appview');let user=null,league=null,isOwner=false,tab='matches',timer,authMode='signin';$('#year').textContent=new Date().getFullYear();
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),3200)}
function defaultState(){return{players:[],matches:[]}}
function code(){const a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}
function leagueUrl(l=league){return new URL(`?league=${encodeURIComponent(l.share_code)}`,location.href).href}
function showAuth(mode='signin'){authMode=mode;$('#authTitle').textContent=mode==='signup'?'Create your admin account':mode==='reset'?'Reset your password':'Welcome back';$('#authHelp').textContent=mode==='signup'?'Create an account with your email. You may need to verify it before signing in.':mode==='reset'?'Choose a new password for your account.':'Sign in to create and manage your leagues.';$('#passwordLabel').classList.toggle('hidden',mode==='forgot');$('#authPassword').required=mode!=='forgot';$('#authPassword').value='';$('#authEmail').value='';$('#authEmail').required=mode!=='reset';$('#authEmail').parentElement.classList.toggle('hidden',mode==='reset');$('#authMessage').textContent='';$('#forgotBtn').classList.toggle('hidden',mode!=='signin');$('#authSwitch').classList.toggle('hidden',!['signin','signup'].includes(mode));$('#authSwitch').textContent=mode==='signup'?'Already have an account? Sign in':'Create account';$('#authSubmit').textContent=mode==='signup'?'Create account':mode==='forgot'?'Send reset email':mode==='reset'?'Save new password':'Sign in';$('#authModal').classList.add('show')}
function directCode(){return new URLSearchParams(location.search).get('league')}
function home(){league=null;isOwner=false;const codeVal=directCode();$('#accountBtn').textContent=user?'My leagues':'Sign in';if(codeVal){loadLeague(codeVal);return}if(user){dashboard();return}host.innerHTML=`<section class="hero"><div><div class="kicker">One hub · your leagues</div><h1>Bring your league together.</h1><p>Create a league for your game, share its direct link, and keep everyone up to date.</p></div><button class="btn primary" id="startBtn">Create a league</button></section><section class="panel"><div class="ph"><div><h2>Welcome to Arena League Hub</h2><p>Players enter through a link shared by their organiser. Each league has its own space and results.</p></div></div><div class="empty">Have a league link? Open it to see that league. Ready to organise your own? Create an account to get started.<br><br><button class="btn primary" id="homeSign">Sign in or create account</button></div></section>`;$('#startBtn').onclick=()=>showAuth('signup');$('#homeSign').onclick=()=>showAuth('signin')}
async function dashboard(){league=null;isOwner=false;$('#accountBtn').textContent='My leagues';host.innerHTML=`<section class="hero"><div><div class="kicker">Your organiser space</div><h1>Your leagues.</h1><p>Only leagues created by your account appear here.</p></div><div class="actions"><button id="newLeague" class="btn primary">＋ Create a league</button><button id="logout" class="btn">Sign out</button></div></section><section class="panel"><div class="ph"><div><h2>League dashboard</h2><p>Share each league’s link with its players.</p></div></div><div id="leagueList" class="league-list"><div class="empty">Loading your leagues…</div></div></section>`;$('#newLeague').onclick=()=>$('#createModal').classList.add('show');$('#logout').onclick=async()=>{await db.auth.signOut();user=null;home()};try{const {data,error}=await db.from('leagues').select('id,name,game,share_code,updated_at').eq('owner_id',user.id).order('created_at',{ascending:false});if(error)throw error;$('#leagueList').innerHTML=data.length?data.map(l=>`<article class="league-card"><h3>${esc(l.name)}</h3><p>${esc(l.game)}</p><div class="actions"><button class="btn primary" data-open="${l.id}">Open</button><button class="btn" data-copy="${l.id}">Copy player link</button><button class="btn danger" data-delete="${l.id}">Delete</button></div></article>`).join(''):'<div class="empty">No leagues yet. Create your first one above.</div>';data.forEach(l=>{const open=host.querySelector(`[data-open="${l.id}"]`);open.onclick=()=>{history.pushState({},'',`?league=${encodeURIComponent(l.share_code)}`);loadLeague(l.share_code)};host.querySelector(`[data-copy="${l.id}"]`).onclick=async()=>{try{await navigator.clipboard.writeText(leagueUrl(l));toast('Player link copied')}catch{prompt('Copy this player link:',leagueUrl(l))}};host.querySelector(`[data-delete="${l.id}"]`).onclick=async()=>{if(!confirm(`Delete “${l.name}” and its results? This cannot be undone.`))return;const{error}=await db.from('leagues').delete().eq('id',l.id).eq('owner_id',user.id);if(error)return toast('Could not delete: '+error.message);toast('League deleted');dashboard()}})}catch(e){$('#leagueList').innerHTML=`<div class="empty">Could not load your leagues. Apply the database setup before using the hub.<br>${esc(e.message)}</div>`}}
async function loadLeague(share){host.innerHTML='<div class="empty">Opening league…</div>';try{let row=null;if(user){const{data,error}=await db.from('leagues').select('*').eq('share_code',share).eq('owner_id',user.id).maybeSingle();if(error)throw error;if(data)row=data}if(!row){const{data,error}=await db.rpc('get_league_by_share_code',{p_share_code:share});if(error)throw error;row=Array.isArray(data)?data[0]:data}if(!row){host.innerHTML='<section class="panel"><div class="empty">This league link is invalid or the league has been removed.<br><button id="backHome" class="btn">Go to Arena League Hub</button></div></section>';$('#backHome').onclick=()=>{history.pushState({},'',location.pathname);home()};return}league=row;isOwner=!!(user&&row.owner_id===user.id);league.state=league.state||defaultState();if(!Array.isArray(league.state.players))league.state.players=[];if(!Array.isArray(league.state.matches))league.state.matches=[];tab='matches';renderLeague()}catch(e){host.innerHTML=`<section class="panel"><div class="empty">Unable to open this league. ${esc(e.message)}</div></section>`}}
function fixtures(){const p=league.state.players,a=[];for(let i=0;i<p.length;i++)for(let j=i+1;j<p.length;j++){const x=p[i],y=p[j];a.push({id:[x.id,y.id].sort().join('_'),home:x.id,away:y.id})}return a}
function standings(){const s=league.state,p=s.players.map(x=>({id:x.id,name:x.name,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0})),by=Object.fromEntries(p.map(x=>[x.id,x]));s.matches.forEach(m=>{const h=by[m.home],a=by[m.away];if(!h||!a)return;h.P++;a.P++;h.GF+=m.hs;h.GA+=m.as;a.GF+=m.as;a.GA+=m.hs;if(m.hs>m.as){h.W++;h.Pts+=3;a.L++}else if(m.as>m.hs){a.W++;a.Pts+=3;h.L++}else{h.D++;a.D++;h.Pts++;a.Pts++}});p.forEach(x=>x.GD=x.GF-x.GA);return p.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.name.localeCompare(b.name))}
function pname(id){return league.state.players.find(p=>p.id===id)?.name||'Removed'}
async function save(){const {error}=await db.from('leagues').update({state:league.state,updated_at:new Date().toISOString()}).eq('id',league.id).eq('owner_id',user.id);if(error){toast('Save failed: '+error.message);await loadLeague(league.share_code);return false}renderLeague();toast('League updated');return true}
function renderLeague(){const s=league.state,r=standings(),played=s.matches.length,total=s.players.length*(s.players.length-1)/2,remaining=Math.max(0,total-played),champ=r[0]||{name:'No champion yet',Pts:0};$('#accountBtn').textContent=user?'My leagues':'Sign in';const complete=s.players.length>=2&&remaining===0;host.innerHTML=`<section class="hero"><div><div class="kicker">${esc(league.game)}${isOwner?' · organiser':''}</div><h1>${esc(league.name)}</h1><p>${isOwner?'Share this league with players. Only your account can edit it.':'Public view · results and standings for this league.'}</p></div><div class="actions">${isOwner?'<button id="copyLink" class="btn primary">Copy player link</button><button id="backDash" class="btn">My leagues</button>':'<button id="homeLink" class="btn">Arena League Hub</button>'}<button id="export" class="btn">↓ Export</button></div></section>${isOwner?`<div class="notice">Player link: <span class="link">${esc(leagueUrl())}</span></div>`:''}<div class="cards"><div class="card"><small>Matches played</small><strong>${played} / ${total}</strong></div><div class="card"><small>Fixtures left</small><strong>${remaining}</strong></div><div class="card"><small>Goals scored</small><strong>${r.reduce((a,x)=>a+x.GF,0)}</strong></div><div class="card"><small>Win / draw</small><strong>3 / 1 pts</strong></div></div><div class="grid"><section class="panel"><div class="ph"><div><h2>League table</h2><p>Points, goal difference, then goals scored</p></div></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${r.map((x,i)=>`<tr class="${i===0&&x.P?'winner':''}"><td>${String(i+1).padStart(2,'0')}</td><td class="name">${esc(x.name)}</td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}</td><td>${x.GA}</td><td>${x.GD>0?'+':''}${x.GD}</td><td class="pts">${x.Pts}</td></tr>`).join('')}</tbody></table></div></section><aside><section class="panel"><div class="ph"><div><h2>${complete?'Tournament champion':'Race to the crown'}</h2><p>${complete?`${esc(champ.name)} wins the league with ${champ.Pts} points.`:`${remaining} matches remaining`}</p></div></div>${[...s.matches].reverse().slice(0,5).map(m=>`<div class="match"><span class="dim">FT</span><span>${esc(pname(m.home))} <span class="dim">vs</span> ${esc(pname(m.away))}</span><b class="score">${m.hs} – ${m.as}</b></div>`).join('')||'<div class="empty">No matches played yet</div>'}</section><section class="panel"><div class="ph"><div><h2>Player stats</h2><p>Season leaders</p></div></div><div class="match"><span class="dim">TOP GOALS</span><b>${esc([...r].sort((a,b)=>b.GF-a.GF)[0]?.name||'—')}</b><b class="pts">${[...r].sort((a,b)=>b.GF-a.GF)[0]?.GF||0}</b></div><div class="match"><span class="dim">MOST WINS</span><b>${esc([...r].sort((a,b)=>b.W-a.W)[0]?.name||'—')}</b><b class="pts">${[...r].sort((a,b)=>b.W-a.W)[0]?.W||0}</b></div></section></aside></div><nav class="tabs"><button class="tab ${tab==='matches'?'active':''}" data-tab="matches">Matches</button><button class="tab ${tab==='players'?'active':''}" data-tab="players">Players</button></nav><main id="content"></main>`;
$('#copyLink')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(leagueUrl());toast('Player link copied')}catch{prompt('Copy this player link:',leagueUrl())}});$('#backDash')?.addEventListener('click',()=>{history.pushState({},'',location.pathname);dashboard()});$('#homeLink')?.addEventListener('click',()=>{history.pushState({},'',location.pathname);home()});$('#export').onclick=exportCsv;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderLeague()});renderContent()}
function renderContent(){const target=$('#content');if(tab==='matches'){const fs=fixtures();target.innerHTML=`<section class="panel"><div class="ph"><div><h2>Match centre</h2><p>${isOwner?'Record or update scores.':'Fixtures and results are public.'}</p></div><select id="filter" class="input" style="width:auto"><option value="all">All fixtures</option><option value="played">Played</option><option value="upcoming">Upcoming</option></select></div><div id="rows"></div></section>`;const fill=()=>{const f=$('#filter')?.value||'all',list=fs.filter(x=>f==='all'||(f==='played')===league.state.matches.some(m=>m.id===x.id));$('#rows').innerHTML=list.map((x,i)=>{const m=league.state.matches.find(y=>y.id===x.id);return`<div class="row"><span class="dim">${String(i+1).padStart(2,'0')}</span><span class="left">${esc(pname(x.home))}</span><input type="number" min="0" max="99" value="${m?m.hs:''}" placeholder="–" data-h="${x.id}" ${isOwner?'':'disabled'}><span class="dim">:</span><input type="number" min="0" max="99" value="${m?m.as:''}" placeholder="–" data-a="${x.id}" ${isOwner?'':'disabled'}><span class="right">${esc(pname(x.away))}</span>${isOwner?`<button class="btn primary" data-save="${x.id}">${m?'Update':'Save'}</button>`:'<span></span>'}</div>`}).join('')||'<div class="empty">Add players to create fixtures.</div>';target.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save,h=target.querySelector(`[data-h="${id}"]`),a=target.querySelector(`[data-a="${id}"]`);if(h.value===''||a.value==='')return toast('Enter both scores');const hs=Number(h.value),as=Number(a.value);if(!Number.isInteger(hs)||!Number.isInteger(as)||hs<0||as<0||hs>99||as>99)return toast('Scores must be whole numbers from 0 to 99');const x=fs.find(z=>z.id===id),old=league.state.matches.findIndex(z=>z.id===id),m={...x,hs,as};if(old<0)league.state.matches.push(m);else league.state.matches[old]=m;await save()})};$('#filter').onchange=fill;fill()}else{target.innerHTML=`<div class="grid"><section class="panel"><div class="ph"><div><h2>Player statistics</h2><p>Current league record</p></div></div><div class="tablewrap"><table><thead><tr><th>Player</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${standings().map(x=>`<tr><td class="name">${esc(x.name)}</td><td>${x.P}</td><td>${x.W}</td><td>${x.D}</td><td>${x.L}</td><td>${x.GF}</td><td>${x.GA}</td><td>${x.GD}</td><td class="pts">${x.Pts}</td></tr>`).join('')}</tbody></table></div></section><section class="panel"><div class="ph"><div><h2>Manage players</h2><p>${isOwner?'15 players maximum':'Tournament roster'}</p></div></div><div class="roster">${isOwner?'<div class="actions"><input class="input" id="newname" maxlength="20" placeholder="Player name"><button class="btn primary" id="add">Add</button></div>':''}${league.state.players.map(p=>`<div class="rosterline"><b>${esc(p.name)}</b>${isOwner?`<button class="btn" data-remove="${p.id}">Remove</button>`:''}</div>`).join('')||'<div class="empty">No players have joined this roster yet.</div>'}${isOwner?'<p><button id="reset" class="btn danger">Reset league results</button></p>':''}</div></section></div>`;if(isOwner){$('#add').onclick=async()=>{const name=$('#newname').value.trim();if(!name)return toast('Enter a player name');if(league.state.players.length>=15)return toast('League is limited to 15 players');if(league.state.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return toast('Name already exists');league.state.players.push({id:'p'+Date.now().toString(36),name});await save()};target.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(league.state.players.length<=2||!confirm('Remove this player and their results?'))return;const id=b.dataset.remove;league.state.players=league.state.players.filter(p=>p.id!==id);league.state.matches=league.state.matches.filter(m=>m.home!==id&&m.away!==id);await save()});$('#reset').onclick=async()=>{if(!confirm('Clear all players and results in this league?'))return;league.state=defaultState();await save();tab='matches';renderLeague()}}}}
function exportCsv(){const rows=standings(),csv=[['Pos','Player','P','W','D','L','GF','GA','GD','Pts'],...rows.map((x,i)=>[i+1,x.name,x.P,x.W,x.D,x.L,x.GF,x.GA,x.GD,x.Pts])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=(league.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')||'league')+'-standings.csv';a.click();URL.revokeObjectURL(a.href)}
$('#accountBtn').onclick=()=>{if(user){history.pushState({},'',location.pathname);dashboard()}else showAuth('signin')};$('#authSwitch').onclick=()=>showAuth(authMode==='signup'?'signin':'signup');$('#authCancel').onclick=()=>$('#authModal').classList.remove('show');$('#createCancel').onclick=()=>$('#createModal').classList.remove('show');$('#authForm').onsubmit=async e=>{e.preventDefault();if(!db)return;const email=$('#authEmail').value.trim(),password=$('#authPassword').value;$('#authMessage').textContent='Working…';let result;if(authMode==='signup')result=await db.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});else if(authMode==='forgot')result=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});else if(authMode==='reset')result=await db.auth.updateUser({password});else result=await db.auth.signInWithPassword({email,password});if(result.error){$('#authMessage').textContent=result.error.message;return}if(authMode==='signup'){$('#authMessage').textContent='Account created. Check your email for the verification link, then sign in.';return}if(authMode==='forgot'){$('#authMessage').textContent='If an account exists for that email, a password reset link has been sent.';return}$('#authModal').classList.remove('show');toast(authMode==='reset'?'Password updated':'Signed in');};$('#forgotBtn').onclick=()=>showAuth('forgot');$('#createForm').onsubmit=async e=>{e.preventDefault();if(!user)return showAuth('signup');const name=$('#leagueName').value.trim(),game=$('#leagueGame').value;const {data,error}=await db.from('leagues').insert({owner_id:user.id,name,game,share_code:code(),state:defaultState()}).select('id,name,game,share_code,state,owner_id').single();if(error)return toast('Could not create league: '+error.message);$('#createModal').classList.remove('show');toast('League created');history.pushState({},'',`?league=${encodeURIComponent(data.share_code)}`);league=data;league.updated_at=new Date().toISOString();isOwner=true;renderLeague()};
window.addEventListener('popstate',()=>home());
if(!ready){$('#status').textContent='Setup needed';host.innerHTML='<section class="panel"><div class="empty">Connect this site to its existing Supabase project to activate accounts and leagues.</div></section>'}else{db.auth.getSession().then(async({data})=>{user=data.session?.user||null;$('#status').textContent='Online';if(location.hash.includes('type=recovery'))showAuth('reset');else home()});db.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;$('#status').textContent='Online';if(league&&user?.id===league.owner_id){isOwner=true;renderLeague()}else if(!league)home()})}
})();
</script>
